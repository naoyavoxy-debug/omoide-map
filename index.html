<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee"><title>2人の思い出マップ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header>
  <div class="brand"><div class="pin">⌖</div><div><h1>2人の思い出マップ</h1><p>ふたりの旅の記録を、日本地図に残そう</p></div></div>
  <button id="resetBtn" class="soft">⋯</button>
</header>

<section class="stats">
 <div><span>訪れた都道府県</span><b><i id="visitedCount">0</i> / 47</b></div>
 <div><span>思い出の数</span><b><i id="memoryCount">0</i> 枚</b></div>
 <div><span>日本制覇</span><b><i id="progressText">0</i>%</b></div>
</section>

<section class="map-card">
 <div class="map-title"><div><h2>思い出マップ</h2><p>都道府県の丸をタップして思い出を追加</p></div><span>JAPAN ♡</span></div>
 <div class="map-wrap">
   <div class="watermark">行った場所を<br>地図に残そう 📷</div>
   <svg class="japan" viewBox="0 0 420 650" aria-label="日本地図">
    <defs><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".12"/></filter></defs>
    <g filter="url(#shadow)" stroke="#fff" stroke-width="4" stroke-linejoin="round">
      <path class="land hokkaido" d="M300 38l42 8 28 23-12 22 18 16-24 25-38-3-24 17-25-20 9-25-17-17 20-17z"/>
      <path class="land tohoku" d="M286 157l38-10 20 26-10 31 8 31-18 28-3 34-30 10-14-29 9-27-10-30 13-25z"/>
      <path class="land kanto" d="M286 306l34-7 27 19-4 31-28 14-24-9-20-24z"/>
      <path class="land chubu" d="M237 290l47 14 7 50-26 35-42-3-19-30 13-32z"/>
      <path class="land kansai" d="M187 350l43 34-12 39-34 11-31-20 3-35z"/>
      <path class="land chugoku" d="M91 382l67-8 28 40-35 25-70-14-23-23z"/>
      <path class="land shikoku" d="M121 452l61-8 18 25-29 24-56-5-13-20z"/>
      <path class="land kyushu" d="M50 428l55 4 21 31-18 37 7 35-28 37-34-14 5-36-26-30z"/>
      <path class="land okinawa" d="M68 607l12-7 9 8-8 10-14 2z"/>
    </g>
   </svg>
   <div id="markers" class="markers"></div>
 </div>
 <div class="legend"><span><i class="dot emptydot"></i>まだ</span><span><i class="dot donedot"></i>思い出あり</span></div>
</section>

<section class="memory-section">
 <div class="section-head"><div><h2>思い出リスト</h2><p>写真をタップすると編集できます</p></div><button id="randomBtn" class="soft">♡</button></div>
 <div id="memoryList" class="memory-list"></div>
</section>
</main>

<dialog id="editor"><form id="memoryForm">
 <div class="dialog-head"><div><small>TRAVEL MEMORY</small><h2 id="prefTitle"></h2></div><button type="button" id="closeBtn">×</button></div>
 <label>行った日<input id="dateInput" type="date"></label>
 <label>思い出メモ<textarea id="noteInput" rows="3" placeholder="ここで何した？"></textarea></label>
 <label class="upload">📷 写真を選ぶ<input id="photoInput" type="file" accept="image/*"></label>
 <img id="preview" class="preview" alt="">
 <div class="actions"><button type="button" id="deleteBtn" class="danger">削除</button><button type="submit" class="primary">思い出を保存 ♡</button></div>
</form></dialog>
<script src="app.js"></script>
</body></html>
