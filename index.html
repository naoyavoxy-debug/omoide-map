<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7fa">
  <title>2人の思い出マップ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">OUR JAPAN MEMORIES</p>
        <h1>2人の思い出マップ ♡</h1>
      </div>
      <button id="resetBtn" class="ghost">リセット</button>
    </header>

    <section class="progress-card">
      <div><b id="visitedCount">0</b><span> / 47 都道府県</span></div>
      <div class="bar"><i id="progressBar"></i></div>
      <small id="progressText">日本制覇 0%</small>
    </section>

    <section class="map-card">
      <h2>日本地図</h2>
      <p>行った都道府県をタップして、写真と思い出を残そう。</p>
      <div id="map" class="map-grid"></div>
    </section>

    <section class="memories">
      <h2>思い出一覧</h2>
      <div id="memoryList" class="memory-list">
        <div class="empty">まだ思い出がありません 📷</div>
      </div>
    </section>
  </main>

  <dialog id="editor">
    <form id="memoryForm" method="dialog">
      <div class="dialog-head">
        <h2 id="prefTitle">思い出を追加</h2>
        <button type="button" id="closeBtn" class="close">×</button>
      </div>
      <label>日付
        <input id="dateInput" type="date">
      </label>
      <label>ひとこと
        <textarea id="noteInput" rows="3" placeholder="ここで何した？"></textarea>
      </label>
      <label class="photo-label">写真を選ぶ
        <input id="photoInput" type="file" accept="image/*">
      </label>
      <img id="preview" class="preview" alt="">
      <div class="actions">
        <button type="button" id="deleteBtn" class="danger">削除</button>
        <button type="submit" class="primary">保存する ♡</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
